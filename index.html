<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Dictation Pro</title>

<link href="https://fonts.googleapis.com/css2?family=ADLaM+Display&display=swap" rel="stylesheet">

<style>
:root {
  --dark: #002D3F;
  --green: #73A333;
  --blue: #00A4C7;
  --purple: #BF61E5;
  --orange: #E76A03;
  --light: #EDEFEE;
}

body {
  margin: 0;
  font-family: 'ADLaM Display', sans-serif;
  background: var(--dark);
  color: var(--light);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.container {
  width: 95%;
  max-width: 500px;
  background: #01394f;
  padding: 20px;
  border-radius: 20px;
  text-align: center;
}

h2 {
  font-size: 28px;
  margin-bottom: 10px;
}

select {
  padding: 10px;
  border-radius: 10px;
  margin-bottom: 15px;
  font-family: inherit;
  font-size: 16px;
}

.files {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 15px;
  margin-top: 15px;
}

.card {
  background: var(--blue);
  padding: 20px;
  border-radius: 16px;
  min-height: 150px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  font-size: 18px;
}

button {
  margin: 5px 0;
  border: none;
  border-radius: 10px;
  padding: 10px;
  font-family: inherit;
  font-size: 16px;
  cursor: pointer;
}

.record-btn { background: var(--orange); }
.play-btn { background: var(--green); }
.stop-btn { background: var(--purple); }
.delete-btn { background: crimson; color: white; }

.indicator {
  width: 12px;
  height: 12px;
  background: red;
  border-radius: 50%;
  margin: 10px auto;
  opacity: 0;
}

.recording { opacity: 1; animation: pulse 1s infinite; }

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.5); }
  100% { transform: scale(1); }
}
</style>
</head>

<body>

<div class="container">

  <a href="https://www.leapingfox.com.au" target="_blank" style="color:#EDEFEE; text-decoration:none; display:block; margin-bottom:10px;">
    ← Back to LeapingFox
  </a>

  <h2>Dictation Tool</h2>

  <select id="mode" onchange="render()">
    <option value="record">Record</option>
    <option value="play">Play</option>
    <option value="analyse">Analyse</option>
  </select>

  <div class="indicator" id="recLight"></div>
  <div id="content"></div>

</div>

<script>
let mediaRecorder;
let audioChunks = [];
let files = [];
let playCounts = [];
let stream;
let isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

// 🎧 SINGLE AUDIO LOCK
let currentAudio = null;
let currentIndex = null;

async function initRecorder() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });

    if (!isIOS && window.MediaRecorder) {
      mediaRecorder = new MediaRecorder(stream);

      mediaRecorder.ondataavailable = e => {
        if (e.data.size > 0) audioChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(audioChunks);
        saveRecording(blob);
      };
    }

  } catch (err) {
    alert("Mic error: " + err.message);
  }
}

function saveRecording(blob) {
  files.push(blob);
  playCounts.push(0);
  audioChunks = [];
  document.getElementById('recLight').classList.remove('recording');
  render();
}

async function startRecording() {
  if (!stream) await initRecorder();

  document.getElementById('recLight').classList.add('recording');

  if (isIOS) {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = "audio/*";
    input.capture = "microphone";

    input.onchange = e => {
      const file = e.target.files[0];
      if (file) {
        files.push(file);
        playCounts.push(0);
        render();
      }
    };

    input.click();
    document.getElementById('recLight').classList.remove('recording');
    return;
  }

  if (mediaRecorder && mediaRecorder.state !== "recording") {
    audioChunks = [];
    mediaRecorder.start();
  }
}

function stopRecording() {
  if (!isIOS && mediaRecorder && mediaRecorder.state === "recording") {
    mediaRecorder.stop();
  }
}

// ▶️ PLAY (LOCKED)
function playFile(i) {

  // Stop any currently playing audio
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
  }

  const url = URL.createObjectURL(files[i]);
  const audio = new Audio(url);

  currentAudio = audio;
  currentIndex = i;

  audio.play();

  audio.onended = () => {
    currentAudio = null;
    currentIndex = null;
  };

  playCounts[i]++;
  render();
}

// ⏹ STOP
function stopAudio() {
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
    currentAudio = null;
    currentIndex = null;
  }
}

// 🗑 DELETE
function deleteFile(i) {
  if (i === currentIndex) stopAudio();
  files.splice(i, 1);
  playCounts.splice(i, 1);
  render();
}

// 🎨 RENDER
function render() {
  const mode = document.getElementById('mode').value;
  const container = document.getElementById('content');
  container.innerHTML = '';

  if (mode === 'record') {
    container.innerHTML += `
      <button class="record-btn" onclick="startRecording()">Record</button>
      <button onclick="stopRecording()">Stop</button>
    `;
  }

  const fileContainer = document.createElement('div');
  fileContainer.className = 'files';

  files.forEach((file, i) => {
    const card = document.createElement('div');
    card.className = 'card';

    if (mode === 'record') {
      card.innerHTML = `
        <div>Sentence ${i+1}</div>
        <button class="delete-btn" onclick="deleteFile(${i})">✖</button>
      `;
    }

    if (mode === 'play') {
      card.innerHTML = `
        <div>Sentence ${i+1}</div>
        <button class="play-btn" onclick="playFile(${i})">Play</button>
        <button class="stop-btn" onclick="stopAudio()">Stop</button>
      `;
    }

    if (mode === 'analyse') {
      card.innerHTML = `
        <div>Sentence ${i+1}</div>
        <div>Plays: ${playCounts[i]}</div>
      `;
    }

    fileContainer.appendChild(card);
  });

  container.appendChild(fileContainer);
}

render();
</script>

</body>
</html>
